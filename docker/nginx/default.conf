server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # "php-fpm" must match the php-fpm service name once docker-compose.yml is written.
    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # TLS berhenti di Traefik, jadi request yang sampai ke sini selalu HTTP
        # biasa. Tanpa baris ini Laravel menyimpulkan skemanya "http" dan SETIAP
        # URL yang dibentuknya salah skema — asset() untuk gambar, dan seluruh
        # URL paginasi. Di halaman HTTPS, browser memblokirnya sebagai mixed
        # content: baris data tersimpan, gambarnya rusak.
        #
        # Disetel di sini, bukan lewat TrustProxies + X-Forwarded-Proto, karena
        # SSR dari container "public" memanggil http://nginx-api LANGSUNG tanpa
        # lewat Traefik — jadi tidak punya header itu, dan situs publik akan
        # tetap menghasilkan URL http://. Cara ini menutup kedua jalur.
        #
        # Konsekuensi: image ini menyatakan API-nya selalu dilayani lewat HTTPS.
        # Benar untuk topologi news-article; salah kalau API ini sengaja
        # dijalankan tanpa TLS di depannya.
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
